openapi: 3.0.3
info:
  title: Anand's Store APIs
  version: "1.0.0"
  description: |
    REST APIs for Anand's Store.

    The browser only talks to the **UI** (ALB). UI nginx proxies:

    - `/api/catalog/*` → Service Connect `http://catalog:8080`
    - `/api/sales/*` → Service Connect `http://sales:8080`

    **Buy** (`POST /api/sales/orders`) makes sales call catalog `GET /products/{id}`
    over Service Connect before it accepts the order.

    Paths below are the **public** URLs (via UI / ALB). Inside the cluster,
    drop the `/api/catalog` or `/api/sales` prefix.
  contact:
    name: ecs-sc

servers:
  - url: /
    description: UI / ALB (same origin as the store)

tags:
  - name: Catalog
    description: Product details and images (UI → catalog)
  - name: Sales
    description: Prices, stock, and orders (UI → sales)

paths:
  /api/catalog/health:
    get:
      tags: [Catalog]
      summary: Catalog health
      operationId: catalogHealth
      responses:
        "200":
          description: Service is up
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /api/catalog/products:
    get:
      tags: [Catalog]
      summary: List products
      operationId: listProducts
      responses:
        "200":
          description: All products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /api/catalog/products/{id}:
    get:
      tags: [Catalog]
      summary: Get one product
      description: Used when a product is selected. Sales also calls the internal equivalent before accepting an order.
      operationId: getProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/catalog/images/{file}:
    get:
      tags: [Catalog]
      summary: Product image
      operationId: getProductImage
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            example: h1.svg
      responses:
        "200":
          description: SVG illustration
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
        "404":
          description: Unknown product

  /api/sales/health:
    get:
      tags: [Sales]
      summary: Sales health
      operationId: salesHealth
      responses:
        "200":
          description: Service is up
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /api/sales/prices:
    get:
      tags: [Sales]
      summary: List prices and stock
      operationId: listPrices
      responses:
        "200":
          description: Price list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Price"

  /api/sales/prices/{productId}:
    get:
      tags: [Sales]
      summary: Get price for one product
      operationId: getPrice
      parameters:
        - $ref: "#/components/parameters/ProductIdPath"
      responses:
        "200":
          description: Price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Price"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sales/orders:
    get:
      tags: [Sales]
      summary: List orders on this sales task
      description: In-memory on each replica. With multiple tasks, lists are not shared.
      operationId: listOrders
      responses:
        "200":
          description: Orders, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      tags: [Sales]
      summary: Buy a product
      description: |
        East-west: sales calls catalog `GET /products/{productId}` over Service Connect.
        If catalog confirms the product and stock is available, sales decrements stock
        and returns the order.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              productId: h1
              quantity: 1
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not enough stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockError"
        "502":
          description: Catalog unreachable or error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/sales/orders/{id}:
    get:
      tags: [Sales]
      summary: Get one order
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: h1
    ProductIdPath:
      name: productId
      in: path
      required: true
      schema:
        type: string
        example: h1

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Request error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Product:
      type: object
      required: [id, name, category, description, specs, imageUrl]
      properties:
        id:
          type: string
          example: h1
        name:
          type: string
          example: Harbor Headphones
        category:
          type: string
          example: Audio
        description:
          type: string
        specs:
          type: string
        imageUrl:
          type: string
          example: /images/h1.svg
          description: Path on catalog. Browser uses /api/catalog plus this path.

    Price:
      type: object
      required: [productId, listPrice, salePrice, onSale, stock]
      properties:
        productId:
          type: string
          example: h1
        listPrice:
          type: number
          example: 199
        salePrice:
          type: number
          example: 149
        onSale:
          type: boolean
        stock:
          type: integer
          example: 12

    CreateOrderRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
          example: h1
        quantity:
          type: integer
          minimum: 1
          example: 1

    Order:
      type: object
      required: [id, productId, productName, quantity, unitPrice, total, createdAt, catalogVerified]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
        productName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        total:
          type: number
        createdAt:
          type: string
          format: date-time
        catalogVerified:
          type: boolean
          description: true after sales confirmed the product with catalog

    CreateOrderResponse:
      type: object
      required: [order, stock]
      properties:
        order:
          $ref: "#/components/schemas/Order"
        stock:
          type: integer
          description: Remaining stock after the purchase

    Error:
      type: object
      properties:
        error:
          type: string

    StockError:
      type: object
      properties:
        error:
          type: string
          example: Not enough stock
        stock:
          type: integer
